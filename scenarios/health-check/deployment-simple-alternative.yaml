# Simple Multi-Runtime Socket Approach (Alternative, no init container)
#
# Apply this INSTEAD OF deployment.yaml (not alongside it) — it reuses the
# same Service selector (app: health-check), so running both would make the
# Service bounce between the two pods.
#
# Fix vs. the original: the host socket is mounted with `type: Socket` instead
# of `type: DirectoryOrCreate`. DirectoryOrCreate silently creates an empty
# directory when the path is absent (or isn't a socket), which is why the old
# multi-path version handed the pod empty dirs instead of a usable socket.
# `type: Socket` makes the pod fail fast if the socket isn't where expected.
#
# This node runs Docker (Rancher Desktop + k3s), socket at /run/docker.sock.
# For a CONTAINERD node (EKS/GKE/kind/minikube-containerd), delete the
# docker-sock volume + its two mounts and uncomment the containerd block below.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-check-deployment-simple
  annotations:
    description: "Simple version without init container - direct host socket mount"
spec:
  selector:
    matchLabels:
      app: health-check
  template:
    metadata:
      labels:
        app: health-check
    spec:
      containers:
      - name: health-check
        image: madhuakula/k8s-goat-health-check
        resources:
          limits:
            memory: "100Mi"
            cpu: "30m"
        ports:
        - containerPort: 80
        securityContext:
          privileged: true
        volumeMounts:
          # Docker node: expose the one real host socket at both common paths.
          - mountPath: /var/run/docker.sock
            name: docker-sock
          - mountPath: /run/docker.sock
            name: docker-sock
          # Containerd node: uncomment this and the matching volume below.
          # - mountPath: /run/containerd/containerd.sock
          #   name: containerd-sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /run/docker.sock
            type: Socket   # fail fast if the socket is missing (no empty-dir trap)
        # - name: containerd-sock
        #   hostPath:
        #     path: /run/containerd/containerd.sock
        #     type: Socket

---
apiVersion: v1
kind: Service
metadata:
  name: health-check-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: health-check
