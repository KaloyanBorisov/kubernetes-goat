# DIND (docker-in-docker) exploitation scenario.
#
# Intentionally vulnerable: the container runs privileged AND the host's
# container-runtime socket is mounted in, which turns a web-app command
# injection into full node-runtime control.
#
# The host Docker socket is mounted directly with `type: Socket` so the pod
# fails fast if the socket is missing, instead of the kubelet silently
# creating an empty directory in its place. (The previous init-container +
# emptyDir symlink approach wrote the symlink into a different volume than the
# app mounted, so no socket ever reached the container.)
#
# Node runtime here is Docker (Rancher Desktop + k3s). Under WSL2, Rancher
# Desktop's actual host-facing socket lives at
# /mnt/wsl/rancher-desktop/run/docker.sock, not /run/docker.sock — the plain
# path resolves to a tmpfs stub on this setup since the WSL2 node filesystem
# and the Rancher Desktop VM filesystem are not the same namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenario-2-health-check-deployment
spec:
  selector:
    matchLabels:
      app: health-check
  template:
    metadata:
      labels:
        app: health-check
    spec:
      containers:
      - name: health-check
        image: madhuakula/k8s-goat-health-check
        resources:
          limits:
            memory: "100Mi"
            cpu: "30m"
        ports:
        - containerPort: 80
        securityContext:
          privileged: true
        volumeMounts:
          # Same host socket exposed at both common paths so either works.
          - mountPath: /var/run/docker.sock
            name: docker-sock
          - mountPath: /run/docker.sock
            name: docker-sock
          # CRI-level socket (cri-dockerd shim in front of Docker), for crictl.
          - mountPath: /run/k3s/cri-dockerd/cri-dockerd.sock
            name: cri-dockerd-sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /mnt/wsl/rancher-desktop/run/docker.sock
            type: Socket
        - name: cri-dockerd-sock
          hostPath:
            path: /run/k3s/cri-dockerd/cri-dockerd.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: health-check-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: health-check
